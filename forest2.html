<html>
<head>
<meta charset="utf-8">
<title>Mystic Forest Escape</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://c-frame.github.io/aframe-physics-system/dist/aframe-physics-system.js"></script>
<script>
  const GAME_STATE = {
    INTRO: 'intro',
    CRITICAL: 'critical',
    STABLE: 'stable',
    POWERED: 'powered',
    ESCAPED: 'escaped'
  };

  AFRAME.registerComponent('flicker', {
    tick: function () {
      if (Math.random() > 0.90) this.el.setAttribute('intensity', Math.random() * 0.4 + 0.1);
    }
  });

  AFRAME.registerComponent('natural-sway', {
    init: function () {
      var rotation = this.el.getAttribute('rotation') || {x: 0, y: 0, z: 0};
      var amount = 0.4 + Math.random() * 0.8;
      var duration = 3500 + Math.random() * 3500;
      var delay = Math.random() * 2000;

      this.el.setAttribute(
        'animation__sway',
        'property: rotation.z; from: ' + (rotation.z - amount) + '; to: ' +
        (rotation.z + amount) + '; dir: alternate; loop: true; dur: ' +
        duration + '; delay: ' + delay + '; easing: easeInOutSine'
      );
    }
  });

  AFRAME.registerComponent('game-manager', {
    schema: {
      lightTime: {type: 'number', default: 60},
      state: {type: 'string', default: GAME_STATE.INTRO},
      keypadCode: {type: 'array', default: ['btn3', 'btn1', 'btn2']},
      currentInput: {type: 'number', default: 0}
    },

    init: function () {
      this.ui = document.getElementById('hud-text');
      this.door = document.getElementById('exit-door');
      this.ambient = document.getElementById('ambient-light');
      this.creepyAudio = document.getElementById('snd-creepy');
      this.windAudio = document.getElementById('snd-wind');
      this.cricketsAudio = document.getElementById('snd-crickets');
      this.runeAudio = document.getElementById('snd-rune');
      this.wrongAudio = document.getElementById('snd-wrong');
      this.successAudio = document.getElementById('snd-success');
      this.doorAudio = document.getElementById('snd-door');
      this.restartBtn = document.getElementById('restart-btn');
      this.sporeTrail = document.getElementById('spore-trail');
      this.sporeLight = document.getElementById('spore-light');
      this.portal = document.getElementById('portal-glow');
      this.maxLightTime = this.data.lightTime;
      this.gameOverTriggered = false;
    },

    updateHUD: function(message, color = '#33ff33') {
      this.ui.setAttribute('value', message);
      this.ui.setAttribute('color', color);
    },

    playSound: function(audio) {
      if (!audio) return;
      audio.currentTime = 0;
      audio.play().catch(() => {});
    },

    endGame: function(message, color) {
      this.updateHUD(message, color);
      if (this.creepyAudio) this.creepyAudio.pause();
      if (this.windAudio) this.windAudio.pause();
      if (this.cricketsAudio) this.cricketsAudio.pause();
      var btn = this.restartBtn;
      if (btn) {
        setTimeout(function () { btn.setAttribute('visible', true); }, 2500);
      }
    },

    changeState: function(newState) {
      this.el.setAttribute('game-manager', 'state', newState);
    },

    tick: function (time, delta) {
      if (this.data.state !== GAME_STATE.CRITICAL || this.gameOverTriggered) return;

      this.data.lightTime = Math.max(0, this.data.lightTime - (delta / 1000));
      var lightPercent = Math.ceil((this.data.lightTime / this.maxLightTime) * 100);
      var secondsLeft = Math.ceil(this.data.lightTime);

      if (this.data.lightTime <= 0) {
        this.gameOverTriggered = true;
        this.endGame('CONSUMED BY THE WOODS', '#ff0000');
        document.querySelector('a-scene').setAttribute('fog', 'color: black; near: 0; far: 2');
        return;
      }

      if (this.data.lightTime <= 15) {
        var flash = (Math.floor(time / 250) % 2 === 0) ? '#ff0000' : '#ffffff';
        this.updateHUD('THE DARKNESS IS HERE!\nTIME: ' + secondsLeft + 's\nLIGHT: ' + lightPercent + '%', flash);
      } else {
        this.updateHUD('THE FOG IS CLOSING IN...\nTIME: ' + secondsLeft + 's\nLIGHT: ' + lightPercent + '%', '#ff8800');
      }
    },

    triggerAction: function(targetId, el) {
      if (targetId === 'restart-btn') {
        window.location.reload();
        return;
      }

      if (this.data.state === GAME_STATE.ESCAPED || this.data.lightTime <= 0) return;

      if (this.data.state === GAME_STATE.INTRO && targetId === 'start-btn') {
        this.handleIntro(el);
      } else if (targetId.startsWith('rock') || targetId.startsWith('log')) {
        this.handleObstacle(el);
      } else if (targetId === 'mushroom') {
        this.handleMushroom(el);
      } else if (targetId.startsWith('btn')) {
        this.handleKeypad(targetId, el);
      } else if (targetId === 'exit-door') {
        this.handleDoor();
      }
    },

    handleIntro: function(el) {
      this.changeState(GAME_STATE.CRITICAL);
      el.setAttribute('visible', 'false');
      el.setAttribute('position', '0 1000 0');
      if(this.creepyAudio) this.creepyAudio.play().catch(() => {});
      if(this.windAudio) this.windAudio.play().catch(() => {});
      if(this.cricketsAudio) { this.cricketsAudio.volume = 0.25; this.cricketsAudio.play().catch(() => {}); }
      document.querySelector('a-scene').setAttribute('fog', 'color: #0a110a; near: 2; far: 25');
    },

    handleObstacle: function(el) {
      if (el.body) {
        var force = new CANNON.Vec3((Math.random() - 0.5) * 15, 10, (Math.random() - 0.5) * 15);
        el.body.applyImpulse(force, el.body.position);
        this.updateHUD('PATH CLEARED', '#00ffff');
      }
    },

    handleMushroom: function(el) {
      if (this.data.state !== GAME_STATE.CRITICAL) return;

      this.changeState(GAME_STATE.STABLE);
      this.updateHUD('THE LIGHT IS RESTORED\nAWAKEN THE ANCIENT RUNES');

      if(this.creepyAudio) this.creepyAudio.pause();

      this.ambient.setAttribute('color', '#9fb7ff');
      this.ambient.setAttribute('intensity', '0.45');
      this.ambient.removeAttribute('flicker');

      if (this.sporeTrail) this.sporeTrail.setAttribute('visible', false);
      if (this.sporeLight) this.sporeLight.setAttribute('visible', false);

      document.querySelector('a-scene').setAttribute(
        'animation__clearfog',
        'property: fog.far; to: 45; dur: 2500; easing: easeOutQuad'
      );

      ['btn1', 'btn2', 'btn3'].forEach((id, index) => {
        var rune = document.getElementById(id);
        rune.setAttribute('material', 'emissive', '#ff4400');
        rune.setAttribute('material', 'emissiveIntensity', 0.5);
        rune.setAttribute(
          'animation__runeGlow',
          'property: material.emissiveIntensity; from: 0.2; to: 1; dir: alternate; loop: true; dur: 900; delay: ' + (index * 200)
        );
      });

      this.absorbItem(el);
    },

    handleKeypad: function(targetId, el) {
      if (this.data.state !== GAME_STATE.STABLE) return;

      var expected = this.data.keypadCode[this.data.currentInput];

      if (targetId === expected) {
        this.data.currentInput++;
        this.playSound(this.runeAudio);
        el.setAttribute('material', 'color', '#00ff00');

        if (this.data.currentInput === 3) {
          this.changeState(GAME_STATE.POWERED);
          this.playSound(this.successAudio);
          if (this.portal) this.portal.setAttribute('visible', true);
          this.updateHUD('RUNES ACCEPTED\nENTER THE ARCHWAY', '#00ffff');
        }
      } else {
        this.playSound(this.wrongAudio);
        this.resetKeypad();
      }
    },

    resetKeypad: function() {
      this.data.currentInput = 0;
      this.updateHUD('THE RUNES REJECT YOU.\nTRY AGAIN.', '#ff0000');

      document.getElementById('btn1').setAttribute('material', 'color', '#ff3333');
      document.getElementById('btn2').setAttribute('material', 'color', '#ff3333');
      document.getElementById('btn3').setAttribute('material', 'color', '#ff3333');

      setTimeout(() => {
        if(this.data.state === GAME_STATE.STABLE) {
          this.updateHUD('THE LIGHT IS RESTORED\nAWAKEN THE ANCIENT RUNES');
        }
      }, 1500);
    },

    handleDoor: function() {
      if (this.data.state === GAME_STATE.POWERED) {
        this.changeState(GAME_STATE.ESCAPED);
        this.playSound(this.doorAudio);
        this.endGame('YOU ESCAPED THE FOREST', '#00ffff');

        // Κάνει την αψίδα να βυθιστεί ή να κινηθεί για να περάσεις
        this.door.setAttribute('animation', 'property: position; to: 0 -7 -11; dur: 5000; easing: easeInOutQuad');

        document.querySelector('a-scene').setAttribute('animation__fog', 'property: fog.far; to: 4000; dur: 4000');
      } else {
        this.updateHUD('THE ARCHWAY IS SEALED\nFIND THE RUNES', '#ff3333');
      }
    },

    absorbItem: function(el) {
      var camPos = document.getElementById('cam').getAttribute('position');
      if(el.hasAttribute('dynamic-body')) el.removeAttribute('dynamic-body');
      el.removeAttribute('scannable');
      el.removeAttribute('animation__scale');
      el.setAttribute('animation', 'property: scale; to: 0 0 0; dur: 1000');
      el.setAttribute('animation__pos', 'property: position; to: ' + camPos.x + ' 1 ' + camPos.z + '; dur: 1000');
      setTimeout(() => el.remove(), 1000);
    }
  });

  AFRAME.registerComponent('scannable', {
    init: function () {
      var uiPanelIds = ['start-btn', 'restart-btn'];
      var initialScale = this.el.getAttribute('scale') || {x: 1, y: 1, z: 1};
      this.baseScale = {
        x: initialScale.x,
        y: initialScale.y,
        z: initialScale.z
      };

      this.el.addEventListener('click', () => {
        var scene = document.querySelector('a-scene');
        if (scene && scene.components['game-manager']) {
          scene.components['game-manager'].triggerAction(this.el.id, this.el);
        }
      });

      this.el.addEventListener('mouseenter', () => {
        if (uiPanelIds.indexOf(this.el.id) === -1) {
          var hoverScale = {
            x: this.baseScale.x * 1.08,
            y: this.baseScale.y * 1.08,
            z: this.baseScale.z * 1.08
          };
          this.el.setAttribute(
            'animation__scale',
            'property: scale; to: ' + hoverScale.x + ' ' + hoverScale.y + ' ' + hoverScale.z + '; dur: 200; easing: easeOutQuad'
          );
        }
      });

      this.el.addEventListener('mouseleave', () => {
        if (uiPanelIds.indexOf(this.el.id) === -1) {
          this.el.removeAttribute('animation__scale');
          this.el.setAttribute(
            'scale',
            this.baseScale.x + ' ' + this.baseScale.y + ' ' + this.baseScale.z
          );
        }
      });
    }
  });
</script>
</head>
<body>
<a-scene id="s1" physics="debug: false" fog="color: black; near: 0; far: 3" shadow="type: pcfsoft" game-manager>
  <!-- ΤΑ ΝΕΑ ΣΟΥ ΑΡΧΕΙΑ ΜΕ ΤΑ ΑΠΛΑ ΟΝΟΜΑΤΑ ΠΟΥ ΤΑ ΜΕΤΟΝΟΜΑΣΑΜΕ -->
  <a-assets timeout="10000">
    <a-asset-item id="tree-model" src="tree.glb"></a-asset-item>
    <a-asset-item id="mushroom-model" src="mushroom.glb"></a-asset-item>
    <a-asset-item id="rock-model" src="rock.glb"></a-asset-item>
    <a-asset-item id="arch-model" src="archway.glb"></a-asset-item>
    <a-asset-item id="log-model" src="log.glb"></a-asset-item>
    <img id="ground-texture" src="forest-ground.jpg">

    <!-- Αν οι ήχοι είναι .wav άλλαξε την κατάληξη παρακάτω -->
    <audio id="snd-wind" src="wind.mp3" preload="auto" loop></audio>
    <audio id="snd-creepy" src="creepy.mp3" preload="auto" loop></audio>
    <audio id="snd-crickets" src="crickets.mp3" preload="auto" loop></audio>
    <audio id="snd-rune" src="rune.mp3" preload="auto"></audio>
    <audio id="snd-wrong" src="wrong.mp3" preload="auto"></audio>
    <audio id="snd-success" src="success.mp3" preload="auto"></audio>
    <audio id="snd-door" src="door.mp3" preload="auto"></audio>
  </a-assets>

  <!-- Σκοτεινός ουρανός δάσους -->
  <a-sky src="eso0932a.jpg" rotation="0 90 0" material="fog: false"></a-sky>

  <!-- Μεγάλη φωτεινή σελήνη ψηλά στον ουρανό -->
  <a-sphere src="moon.jpg" radius="8" position="0 35 -40" material="emissive: #fff; emissiveIntensity: 0.6; fog: false"></a-sphere>

  <!-- Χώμα/Γρασίδι - Πάτωμα (Χρησιμοποιούμε χρώμα δάσους αντί για μέταλλο) -->
  <a-plane static-body width="100" height="100" position="0 0 0" rotation="-90 0 0" material="src: #ground-texture; repeat: 20 20; roughness: 1" shadow="receive: true"></a-plane>

  <!-- Αόρατοι τοίχοι (για να μην βγεις εκτός δάσους) -->
  <a-plane static-body width="30" height="10" position="-15 5 0" rotation="0 90 0" visible="false"></a-plane>
  <a-plane static-body width="30" height="10" position="15 5 0" rotation="0 -90 0" visible="false"></a-plane>
  <a-plane static-body width="30" height="10" position="0 5 15" rotation="0 180 0" visible="false"></a-plane>
  <a-plane static-body width="30" height="10" position="0 5 -15" visible="false"></a-plane>

  <a-light id="ambient-light" type="ambient" intensity="0.3" color="#6078aa" flicker></a-light>
  <a-light id="moonlight" type="directional" color="#9db4ff" intensity="0.6" position="0 35 -40" cast-shadow="true" shadow-camera-far="80" shadow-camera-left="-25" shadow-camera-right="25" shadow-camera-top="25" shadow-camera-bottom="-25"></a-light>

  <!-- Δέντρα γύρω από την περίμετρο, με καθαρό κεντρικό μονοπάτι -->
  <a-entity gltf-model="#tree-model" shadow="cast: true" natural-sway position="-9 0 -8" rotation="0 25 0" scale="1.6 1.6 1.6"></a-entity>
  <a-entity gltf-model="#tree-model" shadow="cast: false" natural-sway position="-12 0 -12" rotation="0 75 0" scale="1.9 1.9 1.9"></a-entity>
  <a-entity gltf-model="#tree-model" shadow="cast: false" natural-sway position="-13 0 -4" rotation="0 130 0" scale="1.5 1.5 1.5"></a-entity>
  <a-entity gltf-model="#tree-model" shadow="cast: true" natural-sway position="-11 0 3" rotation="0 205 0" scale="1.7 1.7 1.7"></a-entity>
  <a-entity gltf-model="#tree-model" shadow="cast: false" natural-sway position="-12 0 9" rotation="0 285 0" scale="1.8 1.8 1.8"></a-entity>
  <a-entity gltf-model="#tree-model" shadow="cast: true" natural-sway position="-8 0 13" rotation="0 340 0" scale="1.6 1.6 1.6"></a-entity>
  <a-entity gltf-model="#tree-model" shadow="cast: true" natural-sway position="9 0 -8" rotation="0 315 0" scale="1.7 1.7 1.7"></a-entity>
  <a-entity gltf-model="#tree-model" shadow="cast: false" natural-sway position="12 0 -12" rotation="0 190 0" scale="1.8 1.8 1.8"></a-entity>
  <a-entity gltf-model="#tree-model" shadow="cast: false" natural-sway position="13 0 -3" rotation="0 95 0" scale="1.5 1.5 1.5"></a-entity>
  <a-entity gltf-model="#tree-model" shadow="cast: true" natural-sway position="11 0 4" rotation="0 145 0" scale="1.7 1.7 1.7"></a-entity>
  <a-entity gltf-model="#tree-model" shadow="cast: false" natural-sway position="12 0 10" rotation="0 235 0" scale="1.8 1.8 1.8"></a-entity>
  <a-entity gltf-model="#tree-model" shadow="cast: true" natural-sway position="8 0 13" rotation="0 20 0" scale="1.6 1.6 1.6"></a-entity>
  <a-entity gltf-model="#tree-model" shadow="cast: false" natural-sway position="-7 0 -12" rotation="0 55 0" scale="1.4 1.4 1.4"></a-entity>
  <a-entity gltf-model="#tree-model" shadow="cast: false" natural-sway position="7 0 -12" rotation="0 260 0" scale="1.5 1.5 1.5"></a-entity>
  <a-entity gltf-model="#tree-model" shadow="cast: false" natural-sway position="-4 0 14" rotation="0 115 0" scale="1.3 1.3 1.3"></a-entity>
  <a-entity gltf-model="#tree-model" shadow="cast: false" natural-sway position="4 0 14" rotation="0 300 0" scale="1.4 1.4 1.4"></a-entity>

  <!-- Οδηγία για τον κωδικό στους ρούνους -->
  <a-text value="ANCIENT RUNES:\n3 - 1 - 2" position="4 2.6 -4" rotation="0 -25 0" color="#ffaa00" align="center" scale="1.1 1.1 1.1" opacity="0.9"></a-text>

  <!-- Η Πύλη / Archway -->
  <a-entity id="exit-door" gltf-model="#arch-model" shadow="cast: true; receive: true" position="0 0 -11" scale="1.5 1.5 1.5" scannable></a-entity>
  <a-circle id="portal-glow" position="0 2.5 -10.8" radius="2.2" visible="false" material="shader: flat; color: #66ffff; transparent: true; opacity: 0.15; side: double" animation__portalPulse="property: material.opacity; from: 0.15; to: 0.7; dir: alternate; loop: true; dur: 1200"></a-circle>

  <a-camera id="cam" position="0 1.6 8">
    <!-- Κείμενο Εκκίνησης -->
    <a-plane id="start-btn" position="0 0 -1.5" width="4" height="2" color="#000" opacity="0.9" scannable>
      <a-text value="THE WOODS ARE AWAKE.\nTHE SHADOWS ARE CLOSING IN.\nFIND THE GLOWING SPORE TO SURVIVE.\n\n[ SCAN TO OPEN YOUR EYES ]" align="center" color="#ff8800" scale="0.8 0.8 0.8"></a-text>
    </a-plane>

    <a-plane id="restart-btn" position="0 -1.3 -1.5" width="4" height="1.2" color="#000" opacity="0.9" visible="false" scannable>
      <a-text value="[ CLICK TO PLAY AGAIN ]" align="center" color="#ffaa00" scale="0.7 0.7 0.7"></a-text>
    </a-plane>

    <a-text id="hud-text" value="" align="center" position="0 0.85 -2.8" color="#ff3333" width="4.5" scale="0.75 0.75 0.75" font="exo2bold" material="shader: flat; depthTest: false; transparent: true"></a-text>

    <!-- Ο δείκτης στόχευσης -->
    <a-entity cursor="fuse: true; fuseTimeout: 1500"
              position="0 0 -1"
              geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
              material="color: #ffaa00; shader: flat"
              animation__fusing="property: geometry.thetaLength; startEvents: fusing; from: 0; to: 360; dur: 1500"
              animation__reset="property: geometry.thetaLength; startEvents: mouseleave; to: 0; dur: 100">
    </a-entity>
  </a-camera>

  <!-- Μαγικό μονοπάτι από φωτεινά σπόρια -->
  <a-entity id="spore-trail">
    <a-sphere position="0 0.7 6" radius="0.05" material="shader: flat; color: #aaff77; transparent: true; opacity: 0.8" animation="property: position; to: 0 1.2 6; dir: alternate; loop: true; dur: 1600"></a-sphere>
    <a-sphere position="-0.8 0.9 5" radius="0.04" material="shader: flat; color: #ccff99; transparent: true; opacity: 0.7" animation="property: position; to: -0.8 1.4 5; dir: alternate; loop: true; dur: 2100"></a-sphere>
    <a-sphere position="-1.5 0.8 4" radius="0.06" material="shader: flat; color: #99ff66; transparent: true; opacity: 0.75" animation="property: position; to: -1.5 1.4 4; dir: alternate; loop: true; dur: 1800"></a-sphere>
    <a-sphere position="-2.3 1.1 3.4" radius="0.04" material="shader: flat; color: #bbff88; transparent: true; opacity: 0.7" animation="property: position; to: -2.3 1.6 3.4; dir: alternate; loop: true; dur: 2300"></a-sphere>
    <a-sphere position="-3.2 0.9 2.7" radius="0.06" material="shader: flat; color: #aaff77; transparent: true; opacity: 0.8" animation="property: position; to: -3.2 1.5 2.7; dir: alternate; loop: true; dur: 1900"></a-sphere>
    <a-sphere position="-4 1.1 2.2" radius="0.05" material="shader: flat; color: #ddffaa; transparent: true; opacity: 0.85" animation="property: position; to: -4 1.7 2.2; dir: alternate; loop: true; dur: 1700"></a-sphere>
  </a-entity>

  <a-light id="spore-light" type="point" position="-4 1.3 2" color="#99ff66" intensity="1.2" distance="6" decay="2"></a-light>

  <!-- Το μαγικό μανιτάρι που μαζεύεις -->
  <a-entity id="mushroom" gltf-model="#mushroom-model" scale="0.18 0.18 0.18" position="-4 0.45 2" scannable animation="property: position; to: -4 0.7 2; dir: alternate; loop: true; dur: 2000"></a-entity>

  <!-- Φυσικά εμπόδια (Βράχοι) αντί για κιβώτια -->
  <a-entity id="rock1" gltf-model="#rock-model" shadow="cast: true; receive: true" dynamic-body="mass: 5" position="-3.4 0.7 0.6" scale="0.7 0.7 0.7" scannable></a-entity>
  <a-entity id="rock2" gltf-model="#rock-model" shadow="cast: true; receive: true" dynamic-body="mass: 5" position="-5.2 0.55 1.1" scale="0.55 0.55 0.55" scannable></a-entity>
  <a-entity id="rock3" gltf-model="#rock-model" shadow="cast: true; receive: true" dynamic-body="mass: 5" position="-4.8 0.65 3.3" scale="0.65 0.65 0.65" scannable></a-entity>
  <a-entity id="log1" gltf-model="#log-model" shadow="cast: true; receive: true" dynamic-body="mass: 8" position="-2.6 0.5 2.5" scale="0.8 0.8 0.8" scannable></a-entity>

  <!-- Ο Γρίφος (Οι 3 πέτρες / Runes) -->
  <a-entity position="4 1.1 -4" rotation="0 -25 0">
    <a-box id="btn1" width="0.65" height="0.65" depth="0.45" position="-0.9 0 0" material="color: #ff3333; roughness: 0.9" scannable><a-text value="1" align="center" position="0 0 0.24" color="white" scale="0.9 0.9 0.9"></a-text></a-box>
    <a-box id="btn2" width="0.65" height="0.65" depth="0.45" position="0 0 0" material="color: #ff3333; roughness: 0.9" scannable><a-text value="2" align="center" position="0 0 0.24" color="white" scale="0.9 0.9 0.9"></a-text></a-box>
    <a-box id="btn3" width="0.65" height="0.65" depth="0.45" position="0.9 0 0" material="color: #ff3333; roughness: 0.9" scannable><a-text value="3" align="center" position="0 0 0.24" color="white" scale="0.9 0.9 0.9"></a-text></a-box>
  </a-entity>

</a-scene>
</body>
</html>
