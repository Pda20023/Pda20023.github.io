<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orbital Lockdown</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  
  <script>
    // Πολύ απλές μεταβλητές, όπως στην αρχική σου άσκηση
    var time = 60;
    var hasCode = false;
    var gameOver = false;
    var timerInterval;

    // Μόλις φορτώσει η σελίδα, ξεκινάει το χρονόμετρο
    window.onload = function() {
      var display = document.getElementById('screen-text');
      
      timerInterval = setInterval(function() {
        if (gameOver) return;
        time--;
        
        if (time > 0) {
          display.setAttribute('value', 'OXYGEN: ' + time + 's\n\n1. Find Oxygen Tank\n2. Hack Keypad\n3. Escape via Door');
        } else {
          display.setAttribute('value', 'SYSTEM FAILURE\nYOU SUFFOCATED');
          display.setAttribute('color', 'red');
          gameOver = true;
          clearInterval(timerInterval);
        }
      }, 1000);
    };

    // Το βασικό συστατικό για τα αντικείμενα που κλικάρουμε
    AFRAME.registerComponent('game-item', {
      init: function () {
        var el = this.el;
        
        // Όταν το κοιτάς, μεγαλώνει ελάχιστα για να ξέρεις ότι το στοχεύεις
        el.addEventListener('mouseenter', function () {
          if (!gameOver) el.setAttribute('scale', '1.1 1.1 1.1');
        });
        
        // Όταν παίρνεις το βλέμμα σου, επιστρέφει στο κανονικό
        el.addEventListener('mouseleave', function () {
          if (!gameOver) el.setAttribute('scale', '1 1 1');
        });

        // Όταν γεμίσει το κυκλάκι (κλικ)
        el.addEventListener('click', function () {
          if (gameOver) return;
          
          var display = document.getElementById('screen-text');
          
          // Αν σκανάρεις το Οξυγόνο
          if (el.id === 'tank') {
            time += 30; // Κερδίζεις χρόνο
            el.setAttribute('visible', 'false');
            el.setAttribute('position', '0 -10 0'); // Το κρύβουμε κάτω απ' το πάτωμα για να μην ξαναπατηθεί
          }
          
          // Αν σκανάρεις το Keypad
          else if (el.id === 'keypad') {
            hasCode = true;
            el.setAttribute('color', 'green'); // Πρασινίζει για να δείξει ότι ξεκλείδωσε
          }
          
          // Αν σκανάρεις την Πόρτα
          else if (el.id === 'door') {
            if (hasCode) {
              gameOver = true;
              clearInterval(timerInterval);
              
              display.setAttribute('value', 'MISSION ACCOMPLISHED\nYOU ESCAPED!');
              display.setAttribute('color', 'green');
              
              // Η πόρτα ανοίγει προς τα πάνω
              el.setAttribute('animation', 'property: position; to: 0 5 -9.9; dur: 2000');
              
              // Παίζει ο ήχος σου!
              var doorSound = document.getElementById('snd-door');
              if (doorSound) doorSound.play();
            } else {
              display.setAttribute('value', 'DOOR LOCKED\nHACK THE KEYPAD FIRST!');
              // Επαναφέρει το κανονικό κείμενο μετά από 2 δευτερόλεπτα
              setTimeout(function() {
                 if(!gameOver) display.setAttribute('value', 'OXYGEN: ' + time + 's\n\n1. Find Oxygen Tank\n2. Hack Keypad\n3. Escape via Door');
              }, 2000);
            }
          }
        });
      }
    });
  </script>
</head>
<body>
  <a-scene background="color: #050505">
    
    <!-- Εδώ φορτώνουν τα αρχεία σου -->
    <a-assets>
      <audio id="snd-alarm" src="alarm.mp3"></audio>
      <audio id="snd-door" src="door.mp3"></audio>
    </a-assets>

    <!-- Ατμοσφαιρικός Φωτισμός -->
    <a-light type="ambient" color="#222"></a-light>
    <a-light type="point" color="red" intensity="1" position="0 4 0" animation="property: intensity; to: 0.2; dir: alternate; loop: true; dur: 1000"></a-light>
    <a-light type="point" color="cyan" intensity="0.5" position="0 4 -5"></a-light>

    <!-- Το Δωμάτιο -->
    <a-plane width="20" height="20" rotation="-90 0 0" color="#111"></a-plane> <!-- Πάτωμα -->
    <a-plane width="20" height="20" rotation="90 0 0" position="0 10 0" color="#111"></a-plane> <!-- Ταβάνι -->
    <a-plane width="20" height="10" position="0 5 -10" color="#222"></a-plane> <!-- Μπροστά Τοίχος -->
    <a-plane width="20" height="10" position="0 5 10" rotation="0 180 0" color="#222"></a-plane> <!-- Πίσω Τοίχος -->
    <a-plane width="20" height="10" position="-10 5 0" rotation="0 90 0" color="#222"></a-plane> <!-- Αριστερός Τοίχος -->
    <a-plane width="20" height="10" position="10 5 0" rotation="0 -90 0" color="#222"></a-plane> <!-- Δεξιός Τοίχος -->

    <!-- Κεντρική Οθόνη Πληροφοριών (Πάνω στον τοίχο, ΟΧΙ στην κάμερα, για να σκανάρεται τέλεια) -->
    <a-plane position="0 3 -9.8" width="6" height="3" color="black">
      <a-text id="screen-text" value="INITIALIZING..." color="cyan" align="center" position="0 0 0.1" width="5"></a-text>
    </a-plane>

    <!-- Πόρτα Εξόδου -->
    <a-box id="door" game-item width="4" height="6" depth="0.2" position="0 0 -9.9" color="#333">
      <a-text value="EXIT" color="red" align="center" position="0 1 0.12"></a-text>
    </a-box>

    <!-- Keypad (Για να ξεκλειδώσει η πόρτα) -->
    <a-box id="keypad" game-item width="1" height="1" depth="0.2" position="4 1.5 -9.8" color="red">
      <a-text value="HACK" align="center" position="0 0 0.12"></a-text>
    </a-box>

    <!-- Oxygen Tank (Δίνει χρόνο) -->
    <a-cylinder id="tank" game-item radius="0.3" height="1.2" position="-4 0.6 -5" color="blue">
      <a-text value="O2" align="center" rotation="-90 0 0" position="0 0.61 0" color="white"></a-text>
    </a-cylinder>

    <!-- Κάμερα και Λέιζερ (Το fuseTimeout καθορίζει πόσο γρήγορα γεμίζει ο κύκλος - 1.5 δευτερόλεπτο) -->
    <a-camera position="0 1.6 4">
      <a-entity cursor="fuse: true; fuseTimeout: 1500"
                position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                material="color: cyan; shader: flat"
                animation__fusing="property: geometry.thetaLength; startEvents: fusing; from: 0; to: 360; dur: 1500"
                animation__reset="property: geometry.thetaLength; startEvents: mouseleave; to: 0; dur: 10">
      </a-entity>
    </a-camera>

  </a-scene>
</body>
</html>
