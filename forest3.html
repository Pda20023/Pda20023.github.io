<a-scene
  physics="debug: false; gravity: -9.8"
  renderer="
    antialias: true;
    colorManagement: true;
    physicallyCorrectLights: true;
    sortObjects: true
  "
  background="color: #010305"
  fog="type: linear; color: #020609; near: 1.5; far: 21"
  shadow="type: pcfsoft"
  game-manager
  audio-gate
>
  <!-- ======================================================
       ASSETS
       Assets are loaded once and reused by every instance.
       ====================================================== -->

  <a-assets timeout="15000">
    <a-asset-item id="tree-model" src="tree.glb"></a-asset-item>
    <a-asset-item id="mushroom-model" src="mushroom.glb"></a-asset-item>
    <a-asset-item id="rock-model" src="rock.glb"></a-asset-item>
    <a-asset-item id="arch-model" src="archway.glb"></a-asset-item>
    <a-asset-item id="log-model" src="log.glb"></a-asset-item>

    <img id="ground-texture" src="forest-ground.jpg">

    <audio id="snd-wind" src="wind.mp3" preload="auto" loop></audio>
    <audio
      id="snd-creepy"
      src="creepy.mp3"
      preload="auto"
      loop
    ></audio>
    <audio
      id="snd-crickets"
      src="crickets.mp3"
      preload="auto"
      loop
    ></audio>
  </a-assets>

  <!-- ======================================================
       SKY AND MOON
       fog:false keeps the distant background visible.
       ====================================================== -->

  <a-sky
    src="eso0932a.jpg"
    rotation="0 95 0"
    material="fog: false; color: #252d35"
  ></a-sky>

  <a-sphere
    src="moon.jpg"
    radius="2.6"
    position="-17 24 -42"
    material="
      emissive: #c8d8ed;
      emissiveIntensity: 0.32;
      fog: false
    "
  ></a-sphere>

  <!-- ======================================================
       GROUND
       One A-Frame unit represents approximately one metre.
       ====================================================== -->

  <a-plane
    static-body
    width="90"
    height="90"
    position="0 0 0"
    rotation="-90 0 0"
    material="
      src: #ground-texture;
      repeat: 24 24;
      roughness: 1;
      metalness: 0;
      color: #344039
    "
    shadow="receive: true"
  ></a-plane>

  <!-- Invisible boundary walls -->

  <a-plane
    static-body
    width="34"
    height="8"
    position="-17 4 0"
    rotation="0 90 0"
    visible="false"
  ></a-plane>

  <a-plane
    static-body
    width="34"
    height="8"
    position="17 4 0"
    rotation="0 -90 0"
    visible="false"
  ></a-plane>

  <a-plane
    static-body
    width="34"
    height="8"
    position="0 4 17"
    rotation="0 180 0"
    visible="false"
  ></a-plane>

  <a-plane
    static-body
    width="34"
    height="8"
    position="0 4 -17"
    visible="false"
  ></a-plane>

  <!-- ======================================================
       ATMOSPHERIC LIGHTING
       ambient-light is referenced by game-manager.
       ====================================================== -->

  <a-light
    id="ambient-light"
    type="ambient"
    intensity="0.16"
    color="#405067"
    flicker
  ></a-light>

  <a-light
    type="directional"
    color="#8da8cb"
    intensity="0.42"
    position="-12 24 -18"
    cast-shadow="true"
    shadow-camera-far="55"
    shadow-camera-left="-18"
    shadow-camera-right="18"
    shadow-camera-top="18"
    shadow-camera-bottom="-18"
  ></a-light>

  <!-- ======================================================
       FOREST ENVIRONMENT
       The trail runs from the camera at z=8 toward z=-11.
       Trees use staggered clusters rather than a circle.
       ====================================================== -->

  <a-entity id="forest-environment">

    <!-- NEAR LEFT SIDE -->

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="-5.8 0 9.2"
      rotation="0 18 0"
      scale="2.75 2.75 2.75"
      shadow="cast: true; receive: true"
    ></a-entity>

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="-3.9 0 6"
      rotation="0 72 0"
      scale="2.3 2.3 2.3"
      shadow="cast: true; receive: true"
    ></a-entity>

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="-6.6 0 3.8"
      rotation="0 141 0"
      scale="3.05 3.05 3.05"
      shadow="cast: true; receive: true"
    ></a-entity>

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="-5.1 0 0.1"
      rotation="0 224 0"
      scale="2.55 2.55 2.55"
      shadow="cast: true; receive: true"
    ></a-entity>

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="-7 0 -2.8"
      rotation="0 309 0"
      scale="3.2 3.2 3.2"
      shadow="cast: true; receive: true"
    ></a-entity>

    <a-entity
      gltf-model="#tree-model"

      rotation="0 36 0"

      gltf-model="#tree-model"

      rotation="0 188 0"
      scale="2.9 2.9 2.9"
      shadow="cast: true; receive: true"
    ></a-entity>

    <a-entity
      gltf-model="#tree-model"

      scale="2.25 2.25 2.25"
      shadow="cast: true; receive: true"
    ></a-entity>

    <!-- NEAR RIGHT SIDE -->

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="4.9 0 9.6"
      rotation="0 331 0"
      scale="2.6 2.6 2.6"
      shadow="cast: true; receive: true"
    ></a-entity>

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="3.8 0 6.4"
      rotation="0 201 0"
      scale="2.25 2.25 2.25"
      shadow="cast: true; receive: true"
    ></a-entity>

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="6.4 0 3.4"
      rotation="0 96 0"
      scale="3.05 3.05 3.05"
      shadow="cast: true; receive: true"
    ></a-entity>

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="7.2 0 -0.2"
      rotation="0 149 0"
      scale="2.7 2.7 2.7"
      shadow="cast: true; receive: true"
    ></a-entity>

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="7 0 -5.5"
      rotation="0 241 0"
      scale="3.15 3.15 3.15"
      shadow="cast: true; receive: true"
    ></a-entity>

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="4.9 0 -8"
      rotation="0 24 0"
      scale="2.35 2.35 2.35"
      shadow="cast: true; receive: true"
    ></a-entity>

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="6.5 0 -11.4"
      rotation="0 117 0"
      scale="2.85 2.85 2.85"
      shadow="cast: true; receive: true"
    ></a-entity>

    <!-- OUTER LEFT FOG LAYER
         No dynamic bodies or shadows are used here. -->

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="-11.6 0 12"
      rotation="0 58 0"
      scale="3.35 3.35 3.35"
    ></a-entity>

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="-10.2 0 6.9"
      rotation="0 173 0"
      scale="2.95 2.95 2.95"
    ></a-entity>

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="-12.6 0 1"
      rotation="0 278 0"
      scale="3.25 3.25 3.25"
    ></a-entity>

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="-10.8 0 -5"
      rotation="0 11 0"
      scale="2.8 2.8 2.8"
    ></a-entity>

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="-11.5 0 -11.5"
      rotation="0 207 0"
      scale="3.4 3.4 3.4"
    ></a-entity>

    <!-- OUTER RIGHT FOG LAYER -->

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="11.3 0 12.7"
      rotation="0 299 0"
      scale="3.15 3.15 3.15"
    ></a-entity>

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="10.1 0 7.1"
      rotation="0 83 0"
      scale="2.85 2.85 2.85"
    ></a-entity>

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="12.7 0 1.8"
      rotation="0 194 0"
      scale="3.3 3.3 3.3"
    ></a-entity>

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="10.8 0 -4"
      rotation="0 344 0"
      scale="2.9 2.9 2.9"
    ></a-entity>

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="11.7 0 -10.8"
      rotation="0 132 0"
      scale="3.35 3.35 3.35"
    ></a-entity>

    <!-- TREES BEHIND THE ARCHWAY -->

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="-2.8 0 -15.2"
      rotation="0 51 0"
      scale="2.7 2.7 2.7"
    ></a-entity>

    <a-entity
      gltf-model="#tree-model"
      natural-sway
      position="3.2 0 -15.8"
      rotation="0 228 0"
      scale="3.1 3.1 3.1"
    ></a-entity>

    <!-- DECORATIVE FALLEN LOGS
         These are visual-only to reduce CANNON.js workload. -->

    <a-entity
      gltf-model="#log-model"
      position="6.2 0.18 7.1"
      rotation="4 38 84"
      scale="0.3 0.3 0.3"
      shadow="cast: true; receive: true"
    ></a-entity>

    <a-entity
      gltf-model="#log-model"
      position="-7.4 0.2 -4.6"
      rotation="-3 122 88"
      scale="0.28 0.28 0.28"
      shadow="cast: true; receive: true"
    ></a-entity>

    <a-entity
      gltf-model="#log-model"
      position="8 0.16 -9.1"
      rotation="6 244 82"
      scale="0.24 0.24 0.24"
      shadow="cast: true; receive: true"
    ></a-entity>

    <!-- DECORATIVE ROCKS -->

    <a-entity
      gltf-model="#rock-model"
      position="5.7 0.17 4.5"
      rotation="8 27 -4"
      scale="0.16 0.16 0.16"
      shadow="cast: true; receive: true"
    ></a-entity>

    <a-entity
      gltf-model="#rock-model"
      position="-6.5 0.2 7.5"
      rotation="-4 136 6"
      scale="0.2 0.2 0.2"
      shadow="cast: true; receive: true"
    ></a-entity>

    <a-entity
      gltf-model="#rock-model"
      position="7.8 0.14 -1.9"
      rotation="6 219 -3"
      scale="0.13 0.13 0.13"
      shadow="cast: true; receive: true"
    ></a-entity>

    <a-entity
      gltf-model="#rock-model"
      position="-5.3 0.15 -8"
      rotation="2 304 5"
      scale="0.14 0.14 0.14"
      shadow="cast: true; receive: true"
    ></a-entity>
  </a-entity>

  <!-- ======================================================
       RUNE CLUE AND EXIT
       Positions and IDs are preserved.
       ====================================================== -->

  <a-text
    value="ANCIENT RUNES:\n3 - 1 - 2"
    position="4 2.6 -4"
    rotation="0 -25 0"
    color="#ffaa00"
    align="center"
    scale="1.1 1.1 1.1"
  ></a-text>

  <a-entity
    id="exit-door"
    gltf-model="#arch-model"
    position="0 0 -11"
    scale="1.42 1.42 1.42"
    shadow="cast: true; receive: true"
    scannable
  ></a-entity>

  <a-circle
    id="portal-glow"
    position="0 2.5 -10.8"
    radius="2.15"
    visible="false"
    material="
      shader: flat;
      color: #66ffff;
      transparent: true;
      opacity: 0.15;
      side: double
    "
    animation__portalPulse="
      property: material.opacity;
      from: 0.15;
      to: 0.7;
      dir: alternate;
      loop: true;
      dur: 1200
    "
  ></a-circle>

  <!-- ======================================================
       CAMERA, HUD, CURSOR
       ====================================================== -->

  <a-camera id="cam" position="0 1.6 8">
    <a-light
      type="point"
      color="#7896bd"
      intensity="0.16"
      distance="8"
      decay="2"
    ></a-light>

    <a-plane
      id="start-btn"
      position="0 0 -1.5"
      width="4"
      height="2"
      color="#000000"
      opacity="0.9"
      scannable
    >
      <a-text
        value="THE WOODS ARE AWAKE.\nTHE SHADOWS ARE CLOSING IN.\nFIND THE GLOWING SPORE TO SURVIVE.\n\n[ SCAN TO OPEN YOUR EYES ]"
        align="center"
        color="#ff8800"
        scale="0.8 0.8 0.8"
      ></a-text>
    </a-plane>

    <a-plane
      id="restart-btn"
      position="0 -1.3 -1.5"
      width="4"
      height="1.2"
      color="#000000"
      opacity="0.9"
      visible="false"
      scannable
    >
      <a-text
        value="[ CLICK TO PLAY AGAIN ]"
        align="center"
        color="#ffaa00"
        scale="0.7 0.7 0.7"
      ></a-text>
    </a-plane>

    <a-text
      id="hud-text"
      value=""
      align="center"
      position="0 0.85 -2.8"
      color="#ff3333"
      width="4.5"
      scale="0.75 0.75 0.75"
      font="exo2bold"
      material="
        shader: flat;
        depthTest: false;
        transparent: true
      "
    ></a-text>

    <a-entity
      cursor="fuse: true; fuseTimeout: 1500"
      raycaster="objects: [scannable]; far: 30"
      position="0 0 -1"
      geometry="
        primitive: ring;
        radiusInner: 0.02;
        radiusOuter: 0.03
      "
      material="color: #ffaa00; shader: flat"
      animation__fusing="
        property: geometry.thetaLength;
        startEvents: fusing;
        from: 0;
        to: 360;
        dur: 1500
      "
      animation__reset="
        property: geometry.thetaLength;
        startEvents: mouseleave;
        to: 0;
        dur: 100
      "
    ></a-entity>
  </a-camera>

  <!-- ======================================================
       SPORE TRAIL AND MUSHROOM
       ====================================================== -->

  <a-entity id="spore-trail">
    <a-sphere
      position="0 0.7 6"
      radius="0.05"
      material="
        shader: flat;
        color: #aaff77;
        transparent: true;
        opacity: 0.8
      "
      animation="
        property: position;
        to: 0 1.2 6;
        dir: alternate;
        loop: true;
        dur: 1600
      "
    ></a-sphere>

    <a-sphere
      position="-0.8 0.9 5"
      radius="0.04"
      material="
        shader: flat;
        color: #ccff99;
        transparent: true;
        opacity: 0.7
      "
      animation="
        property: position;
        to: -0.8 1.4 5;
        dir: alternate;
        loop: true;
        dur: 2100
      "
    ></a-sphere>

    <a-sphere
      position="-1.5 0.8 4"
      radius="0.06"
      material="
        shader: flat;
        color: #99ff66;
        transparent: true;
        opacity: 0.75
      "
      animation="
        property: position;
        to: -1.5 1.4 4;
        dir: alternate;
        loop: true;
        dur: 1800
      "
    ></a-sphere>

    <a-sphere
      position="-2.3 1.1 3.4"
      radius="0.04"
      material="
        shader: flat;
        color: #bbff88;
        transparent: true;
        opacity: 0.7
      "
      animation="
        property: position;
        to: -2.3 1.6 3.4;
        dir: alternate;
        loop: true;
        dur: 2300
      "
    ></a-sphere>

    <a-sphere
      position="-3.2 0.9 2.7"
      radius="0.06"
      material="
        shader: flat;
        color: #aaff77;
        transparent: true;
        opacity: 0.8
      "
      animation="
        property: position;
        to: -3.2 1.5 2.7;
        dir: alternate;
        loop: true;
        dur: 1900
      "
    ></a-sphere>

    <a-sphere
      position="-4 1.1 2.2"
      radius="0.05"
      material="
        shader: flat;
        color: #ddffaa;
        transparent: true;
        opacity: 0.85
      "
      animation="
        property: position;
        to: -4 1.7 2.2;
        dir: alternate;
        loop: true;
        dur: 1700
      "
    ></a-sphere>
  </a-entity>

  <a-light
    id="spore-light"
    type="point"
    position="-4 1.3 2"
    color="#99ff66"
    intensity="1.15"
    distance="6"
    decay="2"
  ></a-light>

  <a-entity
    id="mushroom"
    gltf-model="#mushroom-model"
    scale="0.17 0.17 0.17"
    position="-4 0.42 2"
    scannable
    animation="
      property: position;
      to: -4 0.68 2;
      dir: alternate;
      loop: true;
      dur: 2000
    "
  ></a-entity>

  <!-- ======================================================
       PHYSICS PUZZLE OBJECTS
       Only these objects receive dynamic CANNON bodies.
       ====================================================== -->

  <a-entity
    id="rock1"
    gltf-model="#rock-model"
    dynamic-body="mass: 5"
    position="-3 0.28 0.6"
    rotation="0 28 0"
    scale="0.17 0.17 0.17"
    shadow="cast: true; receive: true"
    scannable
  ></a-entity>

  <a-entity
    id="rock2"
    gltf-model="#rock-model"
    dynamic-body="mass: 5"
    position="-5.2 0.24 1"
    rotation="0 143 0"
    scale="0.13 0.13 0.13"
    shadow="cast: true; receive: true"
    scannable
  ></a-entity>

  <a-entity
    id="rock3"
    gltf-model="#rock-model"
    dynamic-body="mass: 5"
    position="-5 0.28 3.5"
    rotation="0 258 0"
    scale="0.15 0.15 0.15"
    shadow="cast: true; receive: true"
    scannable
  ></a-entity>

  <a-entity
    id="log1"
    gltf-model="#log-model"
    dynamic-body="mass: 8"
    position="-2.4 0.22 2.8"
    rotation="0 62 88"
    scale="0.27 0.27 0.27"
    shadow="cast: true; receive: true"
    scannable
  ></a-entity>

  <!-- ======================================================
       RUNE KEYPAD
       IDs must remain btn1, btn2 and btn3.
       ====================================================== -->

  <a-entity position="4 1.1 -4" rotation="0 -25 0">
    <a-box
      id="btn1"
      width="0.65"
      height="0.65"
      depth="0.45"
      position="-0.9 0 0"
      material="color: #ff3333; roughness: 0.9"
      scannable
    >
      <a-text
        value="1"
        align="center"
        position="0 0 0.24"
        color="#ffffff"
        scale="0.9 0.9 0.9"
      ></a-text>
    </a-box>

    <a-box
      id="btn2"
      width="0.65"
      height="0.65"
      depth="0.45"
      position="0 0 0"
      material="color: #ff3333; roughness: 0.9"
      scannable
    >
      <a-text
        value="2"
        align="center"
        position="0 0 0.24"
        color="#ffffff"
        scale="0.9 0.9 0.9"
      ></a-text>
    </a-box>

    <a-box
      id="btn3"
      width="0.65"
      height="0.65"
      depth="0.45"
      position="0.9 0 0"
      material="color: #ff3333; roughness: 0.9"
      scannable
    >
      <a-text
        value="3"
        align="center"
        position="0 0 0.24"
        color="#ffffff"
        scale="0.9 0.9 0.9"
      ></a-text>
    </a-box>
  </a-entity>
</a-scene>
