<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orbital Lockdown</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script>
    var locked = true, power = false, gas = true, ended = false, message = "", time = 6000;

    function finishGame() {
      var cam = document.getElementById('cam');
      cam.setAttribute('wasd-controls', 'enabled', false);
      cam.setAttribute('look-controls', 'enabled', false);
      document.getElementById('hud').setAttribute('visible', false);
      document.getElementById('player-cursor').setAttribute('visible', false);
      document.getElementById('dust').pause();

      var ending = document.getElementById('ending-screen');
      ending.setAttribute('visible', true);
      document.getElementById('ending-panel').setAttribute('animation__fadein', 'property: material.opacity; from: 0; to: 0.94; dur: 900; easing: easeOutQuad');
      document.getElementById('ending-title').setAttribute('animation__fadein', 'property: text.opacity; from: 0; to: 1; dur: 900; delay: 250; easing: easeOutQuad');
      document.getElementById('ending-text').setAttribute('animation__fadein', 'property: text.opacity; from: 0; to: 1; dur: 900; delay: 550; easing: easeOutQuad');
    }

    function failGame() {
      ended = true;
      gas = false;

      var alarmEl = document.getElementById('alarm');
      var creepyEl = document.getElementById('creepy');
      var doorEl = document.getElementById('door');
      if (alarmEl.components.sound) alarmEl.components.sound.stopSound();
      if (creepyEl.components.sound) creepyEl.components.sound.stopSound();
      if (doorEl.components.sound) doorEl.components.sound.stopSound();

      var cam = document.getElementById('cam');
      cam.setAttribute('wasd-controls', 'enabled', false);
      cam.setAttribute('look-controls', 'enabled', false);
      document.getElementById('hud').setAttribute('visible', false);
      document.getElementById('player-cursor').setAttribute('visible', false);
      document.getElementById('dust').pause();

      var ending = document.getElementById('ending-screen');
      var panel = document.getElementById('ending-panel');
      var title = document.getElementById('ending-title');
      var endingText = document.getElementById('ending-text');

      ending.setAttribute('visible', true);
      panel.setAttribute('width', 4);
      panel.setAttribute('height', 3);
      panel.setAttribute('material', 'color', '#000000');
      panel.setAttribute('material', 'depthTest', false);
      title.setAttribute('value', 'OXYGEN DEPLETED');
      title.setAttribute('color', '#ff4055');
      endingText.setAttribute('value', 'MISSION FAILED.\nRefresh the page to try again.');
      panel.setAttribute('animation__fadein', 'property: material.opacity; from: 0; to: 1; dur: 1600; easing: easeInQuad');
      title.setAttribute('animation__fadein', 'property: text.opacity; from: 0; to: 1; dur: 800; delay: 900; easing: easeOutQuad');
      endingText.setAttribute('animation__fadein', 'property: text.opacity; from: 0; to: 1; dur: 800; delay: 1200; easing: easeOutQuad');
    }

    AFRAME.registerComponent('updating', {
      tick: function () {
        if (gas) time--;
        if (gas && time <= 0 && !ended) {
          time = 0;
          message = "Oxygen Depleted... Game Over";
          failGame();
        }

        if (message != "") {
          this.el.setAttribute('value', message);
          this.el.setAttribute('color', 'red');
        } else {
          var objective = !power
            ? 'Find the blue Stabilizer'
            : locked
              ? 'Power restored - activate the keypad'
              : 'Airlock unlocked - escape!';
          this.el.setAttribute('value', 'OXYGEN: ' + Math.round(time / 100) + '%\n' + objective);
        }

        var pos = document.getElementById('cam').getAttribute('position');
        if (pos.x < -14) pos.x = -14;
        if (pos.x > 14) pos.x = 14;
        if (pos.z < -14) pos.z = -14;
        if (pos.z > 14) pos.z = 14;
        document.getElementById('cam').setAttribute('position', pos);
      }
    });

    AFRAME.registerComponent('dust-field', {
      init: function () {
        var count = 100;
        var positions = new Float32Array(count * 3);

        for (var i = 0; i < count; i++) {
          positions[i * 3] = Math.random() * 28 - 14;
          positions[i * 3 + 1] = Math.random() * 8.5 + 0.5;
          positions[i * 3 + 2] = Math.random() * 28 - 14;
        }

        var geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        var material = new THREE.PointsMaterial({
          color: 0x9fdcff,
          size: 0.045,
          transparent: true,
          opacity: 0.48,
          depthWrite: false
        });

        this.points = new THREE.Points(geometry, material);
        this.points.raycast = function () {};
        this.el.setObject3D('dust', this.points);
      },

      tick: function (time, delta) {
        if (!this.points) return;
        this.points.rotation.y += delta * 0.000025;
        this.points.position.y = Math.sin(time * 0.00025) * 0.16;
      },

      remove: function () {
        if (!this.points) return;
        this.points.geometry.dispose();
        this.points.material.dispose();
        this.el.removeObject3D('dust');
      }
    });

    AFRAME.registerComponent('non-interactive', {
      init: function () {
        var el = this.el;
        var disableRaycast = function () {
          el.object3D.traverse(function (object) {
            object.raycast = function () {};
          });
        };
        el.addEventListener('loaded', disableRaycast);
        el.addEventListener('object3dset', disableRaycast);
        setTimeout(disableRaycast, 0);
      }
    });

    AFRAME.registerComponent('low-oxygen-vignette', {
      init: function () {
        var canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        var context = canvas.getContext('2d');
        var gradient = context.createRadialGradient(256, 256, 105, 256, 256, 355);
        gradient.addColorStop(0, 'rgba(80, 0, 8, 0)');
        gradient.addColorStop(0.58, 'rgba(90, 0, 8, 0.08)');
        gradient.addColorStop(1, 'rgba(120, 0, 10, 0.95)');
        context.fillStyle = gradient;
        context.fillRect(0, 0, 512, 512);

        var texture = new THREE.CanvasTexture(canvas);
        var geometry = new THREE.PlaneGeometry(2.45, 1.4);
        var material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          opacity: 0,
          depthTest: false,
          depthWrite: false
        });

        this.mesh = new THREE.Mesh(geometry, material);
        this.mesh.position.set(0, 0, -0.52);
        this.mesh.renderOrder = 999;
        this.mesh.raycast = function () {};
        this.currentOpacity = 0;
        this.el.setObject3D('vignette', this.mesh);
      },

      tick: function (timeNow) {
        if (!this.mesh) return;
        var lowOxygen = gas && time <= 2000;
        var target = lowOxygen ? Math.min(0.38, 0.08 + ((2000 - time) / 2000) * 0.3) : 0;
        this.currentOpacity += (target - this.currentOpacity) * 0.06;
        var pulse = lowOxygen ? 0.9 + Math.sin(timeNow * 0.006) * 0.1 : 1;
        this.mesh.material.opacity = this.currentOpacity * pulse;
      },

      remove: function () {
        if (!this.mesh) return;
        this.mesh.material.map.dispose();
        this.mesh.material.dispose();
        this.mesh.geometry.dispose();
        this.el.removeObject3D('vignette');
      }
    });

    AFRAME.registerComponent('steam-burst', {
      init: function () {
        var el = this.el;
        var activated = false;

        el.addEventListener('activate', function () {
          if (activated) return;
          activated = true;

          for (var i = 0; i < 24; i++) {
            let particle = document.createElement('a-sphere');
            var x = Math.random() * 6.4 - 3.2;
            var y = Math.random() * 3.6 + 0.4;
            var z = Math.random() * 0.3;
            var duration = Math.random() * 650 + 950;

            particle.setAttribute('non-interactive', '');
            particle.setAttribute('radius', Math.random() * 0.18 + 0.12);
            particle.setAttribute('position', x + ' ' + y + ' ' + z);
            particle.setAttribute('material', 'color: #d9f4ff; shader: flat; transparent: true; opacity: 0.42');
            particle.setAttribute('animation__move', 'property: position; to: ' + (x * 1.15) + ' ' + (y + 2.4) + ' ' + (z + 2.2) + '; dur: ' + duration + '; easing: easeOutQuad');
            particle.setAttribute('animation__fade', 'property: material.opacity; from: 0.42; to: 0; dur: ' + duration + '; easing: easeOutQuad');
            el.appendChild(particle);

            setTimeout(function () {
              particle.remove();
            }, duration + 100);
          }
        });
      }
    });

    AFRAME.registerComponent('starfield-window', {
      init: function () {
        var canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        var context = canvas.getContext('2d');
        context.fillStyle = '#01020a';
        context.fillRect(0, 0, 512, 512);

        for (var i = 0; i < 240; i++) {
          var x = Math.random() * 512;
          var y = Math.random() * 512;
          var radius = Math.random() * 1.5 + 0.35;
          var alpha = Math.random() * 0.55 + 0.45;
          var blue = Math.random() > 0.72;
          context.beginPath();
          context.arc(x, y, radius, 0, Math.PI * 2);
          context.fillStyle = blue
            ? 'rgba(145, 215, 255, ' + alpha + ')'
            : 'rgba(255, 255, 255, ' + alpha + ')';
          context.fill();
        }

        var texture = new THREE.CanvasTexture(canvas);
        var geometry = new THREE.PlaneGeometry(6.8, 7.8);
        var material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          opacity: 1
        });

        this.mesh = new THREE.Mesh(geometry, material);
        this.mesh.raycast = function () {};
        this.el.setObject3D('starfield', this.mesh);
      },

      tick: function (timeNow) {
        if (!this.mesh) return;
        this.mesh.material.opacity = 0.94 + Math.sin(timeNow * 0.0015) * 0.06;
      },

      remove: function () {
        if (!this.mesh) return;
        this.mesh.material.map.dispose();
        this.mesh.material.dispose();
        this.mesh.geometry.dispose();
        this.el.removeObject3D('starfield');
      }
    });

    AFRAME.registerComponent('obstacle-collision', {
      schema: {
        radius: {default: 0.5}
      },

      init: function () {
        var pos = this.el.getAttribute('position');
        this.lastSafe = {x: pos.x, y: pos.y, z: pos.z};
      },

      tick: function () {
        if (ended) return;
        var pos = this.el.getAttribute('position');
        var obstacles = document.querySelectorAll('.obstacle');
        var blocked = false;

        for (var i = 0; i < obstacles.length; i++) {
          var obstaclePos = obstacles[i].getAttribute('position');
          var size = obstacles[i].getAttribute('geometry');
          var limitX = size.width / 2 + this.data.radius;
          var limitZ = size.depth / 2 + this.data.radius;

          if (Math.abs(pos.x - obstaclePos.x) < limitX && Math.abs(pos.z - obstaclePos.z) < limitZ) {
            blocked = true;
            break;
          }
        }

        if (blocked) {
          this.el.setAttribute('position', this.lastSafe);
        } else {
          this.lastSafe = {x: pos.x, y: pos.y, z: pos.z};
        }
      }
    });

    AFRAME.registerComponent('focusing', {
      init: function () {
        var el = this.el;
        el.addEventListener('mouseenter', function () {
          if (ended) return;
          var pos = document.getElementById('cam').getAttribute('position');

          if (el.id == "door") {
            if (!locked && time >= 0) {
              el.components.sound.playSound();
              document.getElementById('creepy').components.sound.stopSound();
              message = "Mission Accomplished! You Escaped!";
              gas = false;
              ended = true;
              document.getElementById('starfield').setAttribute('visible', true);
              document.getElementById('airlock-steam').emit('activate');
              setTimeout(finishGame, 3000);
              var flash = document.getElementById('victory-flash');
              flash.setAttribute('animation__flashin', 'property: material.opacity; from: 0; to: 0.72; dur: 170; easing: easeOutQuad');
              flash.setAttribute('animation__flashout', 'property: material.opacity; from: 0.72; to: 0; dur: 900; delay: 170; easing: easeInQuad');
              el.setAttribute('animation', 'property: position; to: 0 10 -14.6; dur: 3000');
            }
            return;
          } else if (el.id == "keypad") {
            if (power) {
              locked = false;
              el.setAttribute('material', 'color: #4dff9a');
              document.getElementById('keypad-label').setAttribute('value', 'UNLOCKED');
              var strips = document.querySelectorAll('.door-strip');
              for (var i = 0; i < strips.length; i++) {
                strips[i].setAttribute('material', 'color', '#4dff9a');
                strips[i].setAttribute('material', 'emissive', '#4dff9a');
              }
            }
            return;
          }

          if (el.id == "stabilizer" || el.id == "tank") {
            el.setAttribute('animation', 'property: position; to: ' + pos.x + ' 0 ' + pos.z + '; dur: 1000');

            if (el.id == "stabilizer") {
              power = true;
              gas = false;
              document.getElementById('alarm').components.sound.stopSound();
              document.getElementById('creepy').components.sound.playSound();
              document.getElementById('ambient').setAttribute('light', 'color', '#19a8be');
              var emergency = document.getElementById('emergency');
              emergency.removeAttribute('animation__pulse');
              emergency.setAttribute('light', 'color', '#19a8be');
              emergency.setAttribute('light', 'intensity', 0.8);
              document.getElementById('keypad-label').setAttribute('value', 'READY');
            } else if (el.id == "tank") {
              time += 3000;
            }

            setTimeout(function () { el.remove(); }, 1500);
          }
        });
      }
    });
  </script>
</head>
<body>
  <a-scene background="color: #02040d" fog="type: linear; color: #02040d; near: 2; far: 25">
    <a-assets>
      <audio id="snd-door" src="door.mp3"></audio>
      <audio id="snd-alarm" src="alarm.mp3" preload="auto"></audio>
      <audio id="snd-creepy" src="creepy.mp3" preload="auto"></audio>
    </a-assets>

    <a-entity id="alarm" sound="src: #snd-alarm; autoplay: true; loop: true"></a-entity>
    <a-entity id="creepy" sound="src: #snd-creepy; loop: true; volume: 0.55"></a-entity>
    <a-entity id="dust" dust-field></a-entity>
    <a-light id="emergency" type="point" color="#ff2438" intensity="0.35" distance="30" position="0 8 0" animation__pulse="property: light.intensity; from: 0.2; to: 1.8; dur: 650; dir: alternate; loop: true; easing: easeInOutSine"></a-light>

    <a-light id="ambient" type="ambient" color="#152342" intensity="0.32"></a-light>
    <a-light type="point" color="#32b9ff" intensity="1.4" distance="13" position="0 7 5"></a-light>

    <a-plane width="30" height="30" rotation="-90 0 0" material="color: #101722; metalness: 0.7"></a-plane>
    <a-plane width="30" height="10" position="-15 5 0" rotation="0 90 0" material="color: #0b111b; metalness: 0.75"></a-plane>
    <a-plane width="30" height="10" position="15 5 0" rotation="0 -90 0" material="color: #0b111b; metalness: 0.75"></a-plane>
    <a-plane width="30" height="10" position="0 5 15" rotation="0 180 0" material="color: #0b111b; metalness: 0.75"></a-plane>
    <a-plane width="30" height="10" position="0 5 -15" material="color: #0b111b; metalness: 0.75"></a-plane>
    <a-plane width="30" height="30" position="0 10 0" rotation="90 0 0" material="color: #080c13; metalness: 0.9"></a-plane>

    <a-box class="obstacle" width="2.2" height="2.2" depth="2.2" position="-3.5 1.1 4.5" material="color: #263649; metalness: 0.75; roughness: 0.5"></a-box>
    <a-box class="obstacle" width="1.6" height="1.6" depth="1.6" position="4.5 0.8 4" material="color: #344459; metalness: 0.7; roughness: 0.55"></a-box>
    <a-box class="obstacle" width="2.4" height="2.4" depth="2.4" position="-9 1.2 1" material="color: #293a4d; metalness: 0.8; roughness: 0.48"></a-box>
    <a-box class="obstacle" width="2" height="2" depth="2" position="9.5 1 -1" material="color: #31465a; metalness: 0.72; roughness: 0.52"></a-box>
    <a-box class="obstacle" width="1.8" height="1.8" depth="1.8" position="-2.5 0.9 -7.5" material="color: #2b3d50; metalness: 0.78; roughness: 0.5"></a-box>
    <a-box class="obstacle" width="2.5" height="2.5" depth="2.5" position="3.5 1.25 -10" material="color: #25384b; metalness: 0.82; roughness: 0.45"></a-box>
    <a-box class="obstacle" width="1.5" height="1.5" depth="1.5" position="10.5 0.75 8" material="color: #37495c; metalness: 0.68; roughness: 0.58"></a-box>

    <a-entity id="starfield" position="0 4 -14.92" visible="false" starfield-window></a-entity>

    <a-entity id="door" position="0 4 -14.6" sound="src: #snd-door" focusing>
      <a-box width="7" height="8" depth="0.55" material="color: #142431; metalness: 0.8"></a-box>
      <a-box class="door-strip" width="0.14" height="8.2" depth="0.1" position="-3.56 0 0.35" material="color: #ff2438; emissive: #ff2438; emissiveIntensity: 1.6"></a-box>
      <a-box class="door-strip" width="0.14" height="8.2" depth="0.1" position="3.56 0 0.35" material="color: #ff2438; emissive: #ff2438; emissiveIntensity: 1.6"></a-box>
      <a-box class="door-strip" width="7.25" height="0.14" depth="0.1" position="0 4.06 0.35" material="color: #ff2438; emissive: #ff2438; emissiveIntensity: 1.6"></a-box>
      <a-box class="door-strip" width="7.25" height="0.14" depth="0.1" position="0 -4.06 0.35" material="color: #ff2438; emissive: #ff2438; emissiveIntensity: 1.6"></a-box>
      <a-torus radius="1.05" radius-tubular="0.07" position="0 0 0.32" material="color: #416070"></a-torus>
      <a-text value="AIRLOCK" align="center" position="0 1.85 0.34" color="#97d7e8" width="4"></a-text>
    </a-entity>

    <a-entity id="airlock-steam" position="0 0 -14.1" steam-burst non-interactive></a-entity>

    <a-entity id="stabilizer" position="-6 0 -6" focusing>
      <a-cylinder radius="1.25" height="0.7" position="0 0.35 0" material="color: #26394c; metalness: 0.8"></a-cylinder>
      <a-sphere radius="0.57" position="0 1.55 0" material="color: #47d8ff; opacity: 0.8"></a-sphere>
      <a-sphere radius="0.9" position="0 1.55 0" material="color: #47d8ff; shader: flat; transparent: true; opacity: 0.1; side: back" non-interactive animation__pulse="property: material.opacity; from: 0.08; to: 0.3; dur: 850; dir: alternate; loop: true; easing: easeInOutSine"></a-sphere>
      <a-light type="point" color="#47d8ff" intensity="0.65" distance="7" position="0 1.55 0" animation__pulse="property: light.intensity; from: 0.45; to: 1.25; dur: 850; dir: alternate; loop: true; easing: easeInOutSine"></a-light>
    </a-entity>

    <a-box id="tank" width="1.25" height="1.25" depth="1.25" position="-10 0.65 -10" material="color: #5b4538" focusing></a-box>

    <a-entity position="6 0 -6" rotation="0 -28 0">
      <a-box width="3.4" height="2.4" depth="1" position="0 1.2 0" material="color: #192536"></a-box>
      <a-box id="keypad" width="0.8" height="0.8" depth="0.12" position="0 1.2 0.55" material="color: #ff5268" focusing>
        <a-text id="keypad-label" value="NO POWER" align="center" position="0 0 0.1" color="#ffffff" width="3"></a-text>
      </a-box>
    </a-entity>

    <a-camera id="cam" position="0 2.4 10" obstacle-collision>
      <a-entity id="ending-screen" position="0 0 -1.05" visible="false" non-interactive>
        <a-plane id="ending-panel" width="1.95" height="1.15" material="color: #020814; shader: flat; transparent: true; opacity: 0"></a-plane>
        <a-text id="ending-title" value="MISSION ACCOMPLISHED" align="center" position="0 0.22 0.01" color="#63ffb0" width="1.8" opacity="0"></a-text>
        <a-text id="ending-text" value="You escaped Orbital Lockdown.\nRefresh the page to play again." align="center" position="0 -0.18 0.01" color="#c8f4ff" width="1.55" opacity="0"></a-text>
      </a-entity>
      <a-entity low-oxygen-vignette></a-entity>
      <a-plane id="victory-flash" position="0 0 -0.6" width="4" height="3" material="color: #d9fbff; shader: flat; transparent: true; opacity: 0; depthTest: false" non-interactive></a-plane>
      <a-text id="hud" updating value="" align="center" geometry="primitive: plane; width: 6; height: 1" position="0 0.5 -1.5" material="opacity: 0" color="#9dfcff"></a-text>
      <a-cursor id="player-cursor" color="cyan" fuse="true" far="10"></a-cursor>
    </a-camera>
  </a-scene>
</body>
</html>
