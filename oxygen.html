<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orbital Lockdown</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  
  <script>
    // Ο κεντρικός εγκέφαλος του παιχνιδιού
    AFRAME.registerComponent("orbital-game", {
      schema: {
        phase: {type: "string", default: "intro"},
        oxygen: {type: "number", default: 60},
        input: {type: "number", default: 0},
        salvage: {type: "number", default: 0}
      },
      
      init: function () {
        this.code = ["btn3", "btn1", "btn2"];
        this.hud = document.querySelector("#hud");
        this.objective = document.querySelector("#objective");
        this.door = document.querySelector("#exit-door");
        this.alarmRig = document.querySelector("#alarm-rig");
        this.ambient = document.querySelector("#ambient");
        this.shield = document.querySelector("#crystal-shield");
        this.startBtn = document.querySelector("#start-btn");
        this.replayBtn = document.querySelector("#replay-btn");
        
        // Φόρτωση Ήχων
        this.sndAlarm = document.querySelector("#snd-alarm");
        this.sndDoor = document.querySelector("#snd-door");
        
        this.codeUnlocked = false;

        this.say("INCOMING TRANSMISSION\nORBITAL-07 IS FAILING", "#ff5268");
        this.setObjective("Scan START to begin.");
      },
      
      tick: function (time, delta) {
        if (this.data.phase !== "critical") return;
        
        this.data.oxygen = Math.max(0, this.data.oxygen - delta / 1000);
        const seconds = Math.ceil(this.data.oxygen);
        
        // Αναβοσβήνει στα τελευταία 15 δευτερόλεπτα
        const color = seconds <= 15 && Math.floor(time / 220) % 2 ? "#ffffff" : "#ff5268";
        
        this.say("LIFE SUPPORT FAILURE\nOXYGEN  " + String(seconds).padStart(2, "0") + "s\n\nFIND THE BLUE STABILIZER", color);
        
        if (this.data.oxygen <= 0) this.lose();
      },
      
      say: function (text, color) {
        this.hud.setAttribute("value", text);
        this.hud.setAttribute("color", color || "#9dfcff");
      },
      
      setObjective: function (text) {
        this.objective.setAttribute("value", "OBJECTIVE  //  " + text);
      },
      
      act: function (id, el) {
        if (id === "replay-btn") return window.location.reload();
        if (id === "start-btn") return this.start();
        
        if (this.data.phase === "won" || this.data.phase === "lost") return;
        
        if (id.startsWith("crate")) return this.openCrate(el);
        if (id === "stabilizer") return this.stabilize(el);
        if (id.startsWith("btn")) return this.keypad(id, el);
        if (id === "power-crystal") return this.powerCore(el);
        if (id === "exit-door") return this.exit();
      },
      
      start: function () {
        if (this.data.phase !== "intro") return;
        
        this.data.phase = "critical";
        
        // Κρύβουμε και απενεργοποιούμε το Start Menu
        this.startBtn.setAttribute("visible", false);
        this.startBtn.classList.remove("interactable");
        this.startBtn.setAttribute("scale", "0 0 0");
        
        // Ανάβει ο συναγερμός (Κόκκινα φώτα και Ήχος)
        this.ambient.setAttribute("light", "color", "#45111e");
        this.ambient.setAttribute("light", "intensity", 0.22);
        this.alarmRig.setAttribute("visible", true);
        this.setObjective("Find the blue oxygen stabilizer.");
        
        if (this.sndAlarm) this.sndAlarm.play().catch(function(){});
      },
      
      openCrate: function (el) {
        if (this.data.phase !== "critical" || el.dataset.opened) return;
        
        el.dataset.opened = "true";
        el.classList.remove("interactable"); // Δεν ξαναπατιέται
        
        this.data.salvage++;
        this.data.oxygen = Math.min(90, this.data.oxygen + 5); // Δίνει +5s
        
        el.setAttribute("material", "color: #42e8ff; emissive: #0d6f8d; emissiveIntensity: 0.8");
        el.setAttribute("animation__open", "property: rotation; to: 0 180 0; dur: 550; easing: easeOutBack");
        
        this.say("SALVAGE RECOVERED  +5s\nBONUS CACHE " + this.data.salvage + " / 3", "#52f6ff");
      },
      
      stabilize: function (el) {
        if (this.data.phase !== "critical") {
          this.say("STABILIZER NOT REQUIRED\nFOLLOW THE ACTIVE OBJECTIVE", "#ff9a63");
          return;
        }
        
        this.data.phase = "stable";
        el.classList.remove("interactable");
        
        // Κλείνει ο συναγερμός
        if (this.sndAlarm) this.sndAlarm.pause();
        this.alarmRig.setAttribute("visible", false);
        
        // Ο φωτισμός γίνεται μπλε
        this.ambient.setAttribute("light", "color", "#244f91");
        this.ambient.setAttribute("light", "intensity", 0.52);
        
        el.setAttribute("animation__collect", "property: scale; to: 0 0 0; dur: 650; easing: easeInBack");
        setTimeout(function() { el.setAttribute("visible", false); }, 650);
        
        this.say("OXYGEN STABLE\nSECURITY CONSOLE ONLINE", "#73b9ff");
        this.setObjective("Enter 3 - 1 - 2 at the right console.");
      },
      
      keypad: function (id, el) {
        if (this.data.phase !== "stable" || this.codeUnlocked) {
          this.say("CONSOLE LOCKED\nFOLLOW THE ACTIVE OBJECTIVE", "#ff9a63");
          return;
        }
        
        // Λάθος κωδικός
        if (id !== this.code[this.data.input]) {
          this.data.input = 0;
          ["btn1", "btn2", "btn3"].forEach(function(btnId) {
            document.querySelector("#" + btnId).setAttribute("material", "color: #ff5268; emissive: #5b111d; emissiveIntensity: 0.45");
          });
          this.say("SEQUENCE REJECTED\nRETRY THE OVERRIDE", "#ff6475");
          return;
        }
        
        // Σωστό ψηφίο
        this.data.input++;
        el.setAttribute("material", "color: #4dff9a; emissive: #1c7f47; emissiveIntensity: 0.8");
        
        if (this.data.input < this.code.length) {
          this.say("OVERRIDE ACCEPTED\nINPUT " + this.data.input + " / 3", "#75ffc1");
          return;
        }
        
        // Σωστός Κωδικός
        this.codeUnlocked = true;
        
        ["btn1", "btn2", "btn3"].forEach(function(btnId) {
          document.querySelector("#" + btnId).classList.remove("interactable");
        });
        
        this.shield.setAttribute("animation__drop", "property: scale; to: 0 0 0; dur: 700; easing: easeInBack");
        setTimeout(() => this.shield.setAttribute("visible", false), 700);
        
        this.say("OVERRIDE COMPLETE\nPOWER CORE EXPOSED", "#75ffc1");
        this.setObjective("Scan the cyan power crystal.");
      },
      
      powerCore: function (el) {
        if (this.data.phase !== "stable" || !this.codeUnlocked) {
          this.say("CORE SHIELDED\nFOLLOW THE ACTIVE OBJECTIVE", "#ff9a63");
          return;
        }
        
        this.data.phase = "powered";
        el.classList.remove("interactable");
        
        el.setAttribute("animation__collect", "property: scale; to: 0 0 0; dur: 650; easing: easeInBack");
        setTimeout(function() { el.setAttribute("visible", false); }, 650);
        
        // Ο φωτισμός γίνεται έντονος κυανός
        this.ambient.setAttribute("light", "color", "#19a8be");
        this.ambient.setAttribute("light", "intensity", 0.7);
        
        document.querySelector("#door-ring").setAttribute("material", "color: #58fff3; emissive: #18b8b2; emissiveIntensity: 1.5");
        
        this.say("REACTOR ONLINE\nAIRLOCK READY", "#66fff2");
        this.setObjective("Scan the airlock door.");
      },
      
      exit: function () {
        if (this.data.phase !== "powered") {
          this.say("AIRLOCK UNPOWERED\nFOLLOW THE ACTIVE OBJECTIVE", "#ff9a63");
          return;
        }
        
        this.data.phase = "won";
        this.door.classList.remove("interactable");
        
        // Ανοίγει η πόρτα και παίζει ο ήχος
        if (this.sndDoor) this.sndDoor.play().catch(function(){});
        this.door.setAttribute("animation__open", "property: position; to: 0 10 -14.6; dur: 1700; easing: easeInOutQuad");
        
        document.querySelector("#escape-light").setAttribute("light", "intensity", 4);
        const score = Math.round(this.data.oxygen * 10) + this.data.salvage * 250;
        
        this.say("MISSION COMPLETE\nSCORE  " + score + "\n\nYOU ESCAPED ORBITAL-07", "#66fff2");
        this.setObjective("Scan replay to play again.");
        
        this.replayBtn.setAttribute("visible", true);
        this.replayBtn.classList.add("interactable");
      },
      
      lose: function () {
        if (this.data.phase === "lost") return;
        this.data.phase = "lost";
        
        if (this.sndAlarm) this.sndAlarm.pause();
        
        this.ambient.setAttribute("light", "color", "#12040b");
        this.ambient.setAttribute("light", "intensity", 0.06);
        this.say("OXYGEN DEPLETED\nMISSION LOST\n\nSCAN REPLAY TO TRY AGAIN", "#ff5268");
        this.setObjective("Orbital-07 awaits another run.");
        
        this.replayBtn.setAttribute("visible", true);
        this.replayBtn.classList.add("interactable");
      }
    });

    // Ο ΑΛΑΝΘΑΣΤΟΣ ΜΗΧΑΝΙΣΜΟΣ SCAN (Χωρίς να τρέμει)
    AFRAME.registerComponent("interactable", {
      init: function () {
        var el = this.el;
        el.addEventListener("click", function () {
          var game = document.querySelector("#station").components["orbital-game"];
          if (game && el.classList.contains("interactable")) {
             game.act(el.id, el);
          }
        });
        
        el.addEventListener("mouseenter", function () {
          if (el.classList.contains("interactable")) {
            el.setAttribute("scale", "1.1 1.1 1.1"); // Σταθερό zoom, όχι animation!
          }
        });
        
        el.addEventListener("mouseleave", function () {
          el.setAttribute("scale", "1 1 1");
        });
      }
    });
  </script>
</head>
<body>
  
  <a-scene id="station" orbital-game renderer="colorManagement: true; physicallyCorrectLights: true" background="color: #02040d">
    
    <!-- Εδώ φορτώνουν τα ΔΙΚΑ ΣΟΥ αρχεία ήχου -->
    <a-assets timeout="10000">
       <audio id="snd-alarm" src="alarm.mp3" preload="auto" loop></audio>
       <audio id="snd-door" src="door.mp3" preload="auto"></audio>
    </a-assets>

    <!-- Ατμόσφαιρα & Φώτα -->
    <a-light id="ambient" type="ambient" color="#152342" intensity="0.32"></a-light>
    <a-light type="point" color="#32b9ff" intensity="1.4" distance="13" position="0 7 5" animation="property: intensity; from: 0.9; to: 1.4; dir: alternate; loop: true; dur: 800"></a-light>
    <a-light id="escape-light" type="point" color="#74fff1" intensity="0" distance="18" position="0 4 -13"></a-light>

    <!-- Ο Κόκκινος Συναγερμός -->
    <a-entity id="alarm-rig" visible="false" position="0 8 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 1300; easing: linear">
      <a-light type="spot" color="#ff173a" intensity="4" angle="44" distance="24" rotation="-54 0 0"></a-light>
      <a-light type="spot" color="#ff173a" intensity="4" angle="44" distance="24" rotation="-54 180 0"></a-light>
    </a-entity>

    <!-- Το Δωμάτιο (Όμορφα Σκούρα Χρώματα) -->
    <a-plane width="30" height="30" rotation="-90 0 0" material="color: #101722; metalness: 0.7; roughness: 0.42"></a-plane>
    <a-plane width="30" height="10" position="-15 5 0" rotation="0 90 0" material="color: #0b111b; metalness: 0.75"></a-plane>
    <a-plane width="30" height="10" position="15 5 0" rotation="0 -90 0" material="color: #0b111b; metalness: 0.75"></a-plane>
    <a-plane width="30" height="10" position="0 5 15" rotation="0 180 0" material="color: #0b111b; metalness: 0.75"></a-plane>
    <a-plane width="30" height="10" position="0 5 -15" material="color: #0b111b; metalness: 0.75"></a-plane>
    <a-plane width="30" height="30" position="0 10 0" rotation="90 0 0" material="color: #080c13; metalness: 0.9"></a-plane>

    <!-- Το UI - Βρίσκεται στα 3 μέτρα ΜΠΡΟΣΤΑ από τον παίκτη, όχι κολλημένο πάνω του -->
    <a-entity position="0 2.4 -3">
      <a-text id="objective" value="" align="center" position="0 1.2 0" color="#acdff2" width="3.6"></a-text>
      <a-text id="hud" value="" align="center" position="0 0.5 0" color="#9dfcff" width="3.6"></a-text>
      
      <a-plane id="start-btn" class="interactable" interactable position="0 -0.4 0" width="2" height="0.5" material="color: #0b2635; emissive: #135066; emissiveIntensity: 0.8">
        <a-text value="[ SCAN TO START ]" align="center" color="#83fff4" width="3"></a-text>
      </a-plane>

      <a-plane id="replay-btn" visible="false" position="0 -0.4 0" width="2" height="0.5" material="color: #153b44; emissive: #15616a; emissiveIntensity: 0.8">
        <a-text value="[ SCAN TO REPLAY ]" align="center" color="#8afff1" width="3"></a-text>
      </a-plane>
    </a-entity>

    <!-- Πόρτα Airlock -->
    <a-entity id="exit-door" position="0 4 -14.6" class="interactable" interactable>
      <a-box width="7" height="8" depth="0.55" material="color: #142431; metalness: 0.8"></a-box>
      <a-torus id="door-ring" radius="1.05" radius-tubular="0.07" position="0 0 0.32" material="color: #416070; emissive: #0f2733; emissiveIntensity: 0.65"></a-torus>
      <a-text value="AIRLOCK" align="center" position="0 1.85 0.34" color="#97d7e8" width="4"></a-text>
    </a-entity>

    <!-- Το Μπλε Οξυγόνο -->
    <a-entity position="-6 0 -6">
      <a-cylinder radius="1.25" height="0.7" position="0 0.35 0" material="color: #26394c; metalness: 0.8"></a-cylinder>
      <a-entity id="stabilizer" position="0 1.55 0" class="interactable" interactable animation="property: rotation; to: 0 360 0; loop: true; dur: 4200">
        <a-sphere radius="0.57" material="color: #47d8ff; emissive: #148bc3; emissiveIntensity: 1.5; opacity: 0.82; transparent: true"></a-sphere>
        <a-light type="point" color="#41d7ff" intensity="1.5" distance="5"></a-light>
      </a-entity>
      <a-text value="O2 STABILIZER" align="center" position="0 0.04 1.3" rotation="-90 0 0" color="#6cdcff" width="3"></a-text>
    </a-entity>

    <!-- Κιβώτια -->
    <a-entity position="-10 0 -10">
      <a-box id="crate1" width="1.25" height="1.25" depth="1.25" position="0 0.65 0" class="interactable" interactable material="color: #5b4538"></a-box>
      <a-box id="crate2" width="1.25" height="1.25" depth="1.25" position="1.45 0.65 -0.35" rotation="0 18 0" class="interactable" interactable material="color: #4a3d37"></a-box>
      <a-box id="crate3" width="1.25" height="1.25" depth="1.25" position="0.3 1.9 -0.1" rotation="0 -12 0" class="interactable" interactable material="color: #675144"></a-box>
    </a-entity>

    <!-- Keypad (Κονσόλα) -->
    <a-entity position="6 0 -6" rotation="0 -28 0">
      <a-box width="3.4" height="2.4" depth="1" position="0 1.2 0" material="color: #192536; metalness: 0.8"></a-box>
      <a-plane width="2.7" height="1.55" position="0 1.35 0.52" material="color: #08151d; emissive: #062736; emissiveIntensity: 0.6"></a-plane>
      <a-text value="OVERRIDE\n3 — 1 — 2" align="center" position="0 1.86 0.55" color="#89e9ff" width="3"></a-text>
      <a-box id="btn1" width="0.46" height="0.46" depth="0.12" position="-0.72 0.86 0.61" class="interactable" interactable material="color: #ff5268; emissive: #5b111d"><a-text value="1" align="center" position="0 0 0.07"></a-text></a-box>
      <a-box id="btn2" width="0.46" height="0.46" depth="0.12" position="0 0.86 0.61" class="interactable" interactable material="color: #ff5268; emissive: #5b111d"><a-text value="2" align="center" position="0 0 0.07"></a-text></a-box>
      <a-box id="btn3" width="0.46" height="0.46" depth="0.12" position="0.72 0.86 0.61" class="interactable" interactable material="color: #ff5268; emissive: #5b111d"><a-text value="3" align="center" position="0 0 0.07"></a-text></a-box>
    </a-entity>

    <!-- Reactor Core -->
    <a-entity position="6 1.75 -10">
      <a-cylinder radius="1.15" height="1.2" position="0 -1.15 0" material="color: #283540; metalness: 0.85"></a-cylinder>
      <a-entity id="crystal-shield" animation="property: rotation; to: 0 360 0; loop: true; dur: 5000">
        <a-sphere radius="1.15" material="color: #23d9ff; wireframe: true; opacity: 0.72; transparent: true"></a-sphere>
      </a-entity>
      <a-entity id="power-crystal" class="interactable" interactable animation="property: rotation; to: 360 360 0; loop: true; dur: 3000">
        <a-octahedron radius="0.58" material="color: #53fff4; emissive: #13bfb6; emissiveIntensity: 1.4"></a-octahedron>
        <a-light type="point" color="#4effef" intensity="1.3" distance="5"></a-light>
      </a-entity>
    </a-entity>

    <!-- Κάμερα (Μόνο αυτή κουνιέται, το μενού είναι σταθερό στο δωμάτιο!) -->
    <a-camera id="camera" position="0 2.4 1">
      <a-entity cursor="fuse: true; fuseTimeout: 1200"
                raycaster="objects: .interactable; far: 30"
                position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                material="color: #74fff1; shader: flat"
                animation__fusing="property: geometry.thetaLength; startEvents: fusing; from: 0; to: 360; dur: 1200"
                animation__reset="property: geometry.thetaLength; startEvents: mouseleave; to: 0; dur: 100">
      </a-entity>
    </a-camera>

  </a-scene>
</body>
</html>
